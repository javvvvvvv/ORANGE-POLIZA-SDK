{% extends "base.html" %}
{% block titulo %}Iniciar sesión - Orange Poliza{% endblock %}
{% block contenido %}
<div class="max-w-sm mx-auto mt-24">
  <div class="text-center mb-8">
    {% include "logo.html" %}
  </div>

  <form method="post" class="bg-white rounded-xl border border-slate-200 p-6 space-y-4 shadow-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
      <input name="usuario" required autofocus autocapitalize="off" autocomplete="username" class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input name="password" type="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>
    <button class="w-full bg-naranja-600 hover:bg-naranja-700 text-white font-medium rounded-lg py-2.5">
      Entrar
    </button>
  </form>
</div>
{% endblock %}
