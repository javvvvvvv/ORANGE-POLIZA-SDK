{% extends "base.html" %}
{% block titulo %}Iniciar sesión - Orange Poliza{% endblock %}
{% block contenido %}
<div class="max-w-sm mx-auto mt-24">
  <div class="text-center mb-8">
    {% include "logo.html" %}
  </div>

  <form method="post" class="bg-white rounded-xl border border-slate-200 p-6 space-y-4 shadow-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
      <input name="usuario" required autofocus autocapitalize="off" autocomplete="username" class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input name="password" type="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>
    <button class="w-full bg-naranja-600 hover:bg-naranja-700 text-white font-medium rounded-lg py-2.5">
      Entrar
    </button>
  </form>
        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-slate-500">O continuar con</span>
            </div>
          </div>
          <div class="mt-6">
            <a href="/login/google" class="w-full flex items-center justify-center px-4 py-2 border border-slate-300 rounded-lg shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-naranja-500 transition">
              <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google Workspace
            </a>
          </div>
          <div class="mt-3">
            <a href="/login/microsoft" class="w-full flex items-center justify-center px-4 py-2 border border-slate-300 rounded-lg shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-naranja-500 transition">
              <svg class="h-5 w-5 mr-2" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg"><path d="M10 0H0v10h10V0z" fill="#f25022"/><path d="M21 0H11v10h10V0z" fill="#7fba00"/><path d="M10 11H0v10h10V11z" fill="#00a4ef"/><path d="M21 11H11v10h10V11z" fill="#ffb900"/></svg>
              Microsoft / Office 365
            </a>
          </div>

        </div>

</div>
{% endblock %}
